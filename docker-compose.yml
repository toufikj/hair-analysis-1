version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hair_clinic_db
    restart: always
    environment:
      POSTGRES_DB: hair_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Performance tuning
      POSTGRES_INITDB_ARGS: "-E UTF8"
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hair_clinic"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hair_clinic_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hair_clinic_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hair_clinic
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3001
      NODE_ENV: production
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hair_clinic_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hair_clinic_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hair_clinic_network

volumes:
  postgres_data:
    driver: local

networks:
  hair_clinic_network:
    driver: bridge
